name: Update THETVAPP-SOCCER.M3U

on:
  schedule:
    # Every 15 minutes (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch playlist and write THETVAPP-SOCCER.M3U
        run: python scripts/update_thetvapp_soccer.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THETVAPP-SOCCER.M3U
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update THETVAPP-SOCCER.M3U"
            git push
          fi
